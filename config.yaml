project: Vehicle_Recognition
seed: 42
image_size: 224
num_classes: 196
class_names_file: data/metadata/class_mapping.json
model:
  detector_weights: models/pretrained/yolov8n.pt
  classifier_arch: efficientnetv2_rw_s
  hybrid_weights: models/trained/hybrid_classifier.pth
  classifier_weights: models/pretrained/efficientnetv2_best_model.pth
  pretrained: true
  classical_feature_dim: 0  # set after feature schema is finalized
  fusion_dim: 512
  dropout: 0.30
inference:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  roi_padding: 0.05
  device: auto
training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  freeze_backbone_epochs: 3
